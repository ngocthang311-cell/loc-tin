name: Cap nhat tin

on:
  schedule:
    - cron: "7 * * * *"      # mỗi giờ một lần, vào phút thứ 7 (GitHub có thể trễ vài phút)
  workflow_dispatch:          # cho phép bấm chạy tay
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cap-nhat-tin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lay tin
        shell: pwsh
        run: ./fetch-news.ps1

      - name: Dang len GitHub Pages (nhanh gh-pages)
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "loc-tin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Cap nhat tin $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
